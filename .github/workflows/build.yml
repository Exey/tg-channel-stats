name: Build binaries

# macOS here is the arm64 (Apple Silicon) build — macos-latest runners cost
# ~10x the Actions minutes Windows/Linux do, so if minutes are tight this
# job can be dropped and the .app built locally instead (see build.sh).
# Nothing here is code-signed with a Developer ID or notarized, so every
# platform's binary is "from an unidentified developer" on first launch.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows
          - os: ubuntu-latest
            artifact_name: linux
          - os: macos-latest
            artifact_name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same runtime libs the app needs to even *import* PySide6's Qt
      # bindings during PyInstaller's analysis pass — ubuntu-latest doesn't
      # ship them by default. (Windows/macOS wheels bundle their own Qt
      # libs, so no equivalent step is needed there.)
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            binutils libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libx11-6 libxext6 \
            libxrender1 libxi6 libsm6 libice6 libglib2.0-0 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libkrb5-3 libssl3 libgssapi-krb5-2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build binary
        run: python build.py

      # PyInstaller emits a .app *bundle* (a directory) on macOS plus the
      # --onedir folder it's built from. Zip the .app so it survives the
      # download as one file with its symlinks/permissions intact, then drop
      # the loose bundle + folder so the upload step only sees the zip.
      - name: Package .app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          app=$(ls -d tg-channel-stats_*.app)
          ditto -c -k --keepParent "$app" "${app%.app}_macos.zip"
          rm -rf "$app" "${app%.app}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-channel-stats-${{ matrix.artifact_name }}
          path: |
            dist/tg-channel-stats_*
            !dist/tg-channel-stats_*.app
