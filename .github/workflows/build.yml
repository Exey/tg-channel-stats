name: Build binaries

# macOS is intentionally NOT built here: it costs 10x the Actions minutes
# Windows/Linux do, and it's built locally instead (see build.sh) — the
# .app from that local build gets attached to releases by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows
          - os: ubuntu-latest
            artifact_name: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same runtime libs the app needs to even *import* PySide6's Qt
      # bindings during PyInstaller's analysis pass — ubuntu-latest doesn't
      # ship them by default. (Windows/macOS wheels bundle their own Qt
      # libs, so no equivalent step is needed there.)
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            binutils libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libx11-6 libxext6 \
            libxrender1 libxi6 libsm6 libice6 libglib2.0-0 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libkrb5-3 libssl3 libgssapi-krb5-2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build binary
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-channel-stats-${{ matrix.artifact_name }}
          path: |
            dist/tg-channel-stats_*
            !dist/tg-channel-stats_*.app
